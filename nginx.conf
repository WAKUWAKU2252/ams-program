# ═══════════════════════════════════════════════════════════════════════════
# nginx หน้าบ้านของ AMS - เสิร์ฟหน้าเว็บ + ส่งต่อ /api ไปหา backend
#
# ★★ ทำไมต้องมีตัวนี้ ไม่ใช่เปิดสองพอร์ตแยกกัน
#
#    หน้าเว็บถูก build มาโดยฝัง BASE_URL = '/api' ไว้ในไฟล์ js แล้ว (ดู Dockerfile)
#    แปลว่าทุก request ยิงไปที่ **โดเมนเดียวกับหน้าเว็บ** ไม่ได้ยิงข้ามไปพอร์ต 3000
#    ตอน dev ตัวที่ทำงานนี้คือ proxy ของ Vite - พอ build เป็นไฟล์นิ่งก็ไม่มีใครทำให้แล้ว
#    ต้องมี nginx มารับช่วง ไม่งั้นทุก request ตาย 404 ทั้งแอป
#
#    ผลพลอยได้: เป็น origin เดียวกัน = ไม่มี CORS preflight เลยสักครั้ง
#    (ซึ่งเป็นสาเหตุที่ CORS_ORIGIN=http://localhost:5173 ที่ตั้งค้างไว้ยังไม่เคยมีปัญหา)
# ═══════════════════════════════════════════════════════════════════════════

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # อัปโหลดรูปสินทรัพย์เพดาน 10 MB ที่ฝั่ง backend - เผื่อ overhead ของ multipart
  # ★ ตั้งต่ำกว่านี้แล้ว nginx จะตัดที่ 413 ก่อนถึง backend ซึ่งผู้ใช้จะเห็นเป็นหน้า error
  #   ของ nginx ล้วน ๆ ไม่ใช่ข้อความไทยที่ service เขียนไว้ว่าไฟล์ใหญ่เกิน
  client_max_body_size 12m;

  # ── ส่งต่อ API ────────────────────────────────────────────────────────────
  #
  # ★★ proxy_pass **ต้องมี / ปิดท้าย** - มันคือตัวที่ตัด '/api' ออกก่อนส่งต่อ
  #    backend ไม่มี prefix /api (เส้นจริงคือ /assets, /auth, ...) ลืม / ตัวเดียว
  #    ทุกเส้นจะกลายเป็น /api/assets แล้ว 404 ทั้งระบบ
  #    (กติกาเดียวกับ rewrite ใน vite.config.ts ที่ทำหน้าที่นี้ตอน dev)
  location /api/ {
    proxy_pass http://backend:3000/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── สาย SSE ต้องรอดทั้งสามข้อนี้ ────────────────────────────────────────
    #
    # แอปเปิดสาย SSE ค้างไว้สองเส้นต่อแท็บ (/asset-requests/changes + presence
    # ของหน้าที่เปิดอยู่) ถ้าไม่ตั้งสามบรรทัดล่างนี้จะเจออาการที่ดีบักยากมาก:
    #
    #   proxy_buffering on (ค่าตั้งต้น) → nginx อมข้อความไว้รอให้เต็ม buffer
    #                                     = กระดิ่งกับสถานะออนไลน์เงียบไปเฉย ๆ
    #   HTTP/1.0 (ค่าตั้งต้น)           → ไม่มี chunked encoding สายขาดทันที
    #   read_timeout 60s (ค่าตั้งต้น)   → สายถูกตัดทุกนาที แล้วฝั่งจอต่อใหม่วนไป
    #                                     เห็นเป็น "Connection Failed" กะพริบเรื่อย ๆ
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # ── ไฟล์นิ่งที่มี hash ในชื่อ - cache ยาวได้ ──────────────────────────────
  #
  # ★★ **แยกด้วยนามสกุลไฟล์ ห้ามแยกด้วย `location /assets/`**
  #
  #    vite วาง bundle ไว้ที่ /assets/index-CJuddTau.js  แต่แอปก็มีเส้นทางจริงชื่อ
  #    /assets/UBA/COM-100-12-006 ซึ่งเป็น **ปลายทางของ QR บนสติกเกอร์** - ชนกันเป๊ะ
  #
  #    ถ้าจับด้วย prefix แล้วใส่ cache 1 ปี ทั้งก้อน หน้า index.html ที่ fallback ออกไป
  #    จะติด Cache-Control: immutable ไปด้วย = คนที่เคยสแกนสติกเกอร์หนึ่งครั้งจะค้าง
  #    อยู่กับแอปเวอร์ชันนั้นไปทั้งปี deploy กี่รอบก็ไม่เห็น และล้างไม่ได้จากฝั่งเรา
  #
  #    ★ ปลอดภัยเพราะเลขสินทรัพย์มีจุดไม่ได้เลย - ASSET_NUMBER_REGEX บังคับรูปแบบ
  #      ^[A-Z]{3}-\d{3}-\d{2}-[A-Z0-9]{3,7}$ (ดู ams-backend/src/common/asset-number.ts)
  #      URL ของสติกเกอร์จึงไม่มีทางลงท้ายด้วย .js/.css/.png ไปชนกฎนี้ได้
  location ~* ^/assets/.+\.(js|css|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── หน้าเว็บ ──────────────────────────────────────────────────────────────
  #
  # ★ try_files ... /index.html คือตัวที่ทำให้ลิงก์ลึกเปิดได้ - เป็น SPA ที่ routing
  #   อยู่ฝั่งเบราว์เซอร์ ไฟล์จริงบนดิสก์มีแค่ index.html
  #   ★★ ข้อนี้สำคัญเป็นพิเศษกับปลายทางของ QR: คนสแกนเข้ามาที่ /assets/UBA/XXX ตรง ๆ
  #      โดยไม่เคยผ่านหน้าแรก ถ้าไม่มีบรรทัดนี้ = สแกนสติกเกอร์ทุกใบแล้วได้ 404
  location / {
    try_files $uri $uri/ /index.html;
  }
}
